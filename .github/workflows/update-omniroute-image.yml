name: Update OmniRoute Image

# 检查上游 release。我们的 GHCR 还没有该 tag 时，从上游已发布的多架构镜像复制。
# 不在 runner 上 docker build：Next.js 构建会把 ubuntu-latest 打到 OOM。
#
# 源镜像 tag 与上游 release tagName 不一致：git tag 带前导 v（v3.8.52），
# 上游 docker-publish 用 scripts/ci/resolve-docker-publish-version.sh 去掉这一个
# v，所以镜像是 ghcr.io/diegosouzapw/omniroute:3.8.52（Docker Hub 同名 tag）。
# 推到我们仓库时仍用上游 release tagName（v3.8.52）和 latest，保持现有拉取约定。
"on":
  schedule:
    # 北京时间每天 00:00 (晚上12点) == UTC 16:00。偏移到 :27 错开其它任务。
    - cron: "27 16 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发测试

env:
  UPSTREAM_REPO: diegosouzapw/OmniRoute
  # 源 tag = release tagName 去掉一个前导 v。优先公开的 GHCR，没有再试 Docker Hub。
  UPSTREAM_IMAGE_GHCR: ghcr.io/diegosouzapw/omniroute
  UPSTREAM_IMAGE_DOCKERHUB: docker.io/diegosouzapw/omniroute
  IMAGE: ghcr.io/mengfei0053/proxy-agents-omniroute
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  check-and-copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 获取上游最新 release tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view \
            --repo "$UPSTREAM_REPO" \
            --json tagName \
            -q .tagName)
          if [ -z "$TAG" ]; then
            echo "::error::上游 release tag 为空"
            exit 1
          fi
          # 只去掉一个前导 v，与上游 docker-publish 一致。
          # v3.8.52 → 3.8.52。没有前导 v 时源 tag 与 release tag 相同。
          VERSION="${TAG#v}"
          echo "上游最新版本: $TAG"
          echo "上游镜像 tag: $VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 优先用 PAT (write:packages)，没有则回退到 GITHUB_TOKEN
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 对比镜像仓库中是否已有该版本
        id: compare
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "镜像 $IMAGE:$TAG 已存在，无需复制。"
            echo "need_copy=false" >> "$GITHUB_OUTPUT"
          else
            echo "镜像 $IMAGE:$TAG 不存在，上游有更新，开始复制。"
            echo "need_copy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 skopeo
        if: steps.compare.outputs.need_copy == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version

      - name: 复制上游多架构镜像
        id: copy
        if: steps.compare.outputs.need_copy == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_FILE="${RUNNER_TEMP}/ghcr-auth.json"
          umask 077
          AUTH_B64=$(printf '%s:%s' "$GHCR_USER" "$GHCR_PASSWORD" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > "$AUTH_FILE"

          SRC_GHCR="${UPSTREAM_IMAGE_GHCR}:${VERSION}"
          SRC_DOCKERHUB="${UPSTREAM_IMAGE_DOCKERHUB}:${VERSION}"
          if skopeo inspect --raw "docker://${SRC_GHCR}" >/dev/null 2>&1; then
            SRC="$SRC_GHCR"
          elif skopeo inspect --raw "docker://${SRC_DOCKERHUB}" >/dev/null 2>&1; then
            SRC="$SRC_DOCKERHUB"
          else
            echo "::error::找不到公开上游镜像 ${SRC_GHCR} 或 ${SRC_DOCKERHUB}。release tag ${TAG} 的镜像 tag 已去掉前导 v。"
            exit 1
          fi
          echo "从 ${SRC} 复制到 ${IMAGE}:latest 与 ${IMAGE}:${TAG}"
          echo "source=${SRC}" >> "$GITHUB_OUTPUT"

          # latest 先于 $TAG。跳过条件只看 $IMAGE:$TAG，所以版本 tag 最后写：
          # 中途失败时下次调度仍会重试，不会留下“有 tag、没有 latest”的状态。
          copy_tag() {
            local dest_tag="$1"
            # --preserve-digests 让目标 index 与上游 digest 一致，多架构和 attestation 都保留。
            skopeo copy --all --preserve-digests \
              --dest-authfile "$AUTH_FILE" \
              "docker://${SRC}" \
              "docker://${IMAGE}:${dest_tag}"
          }
          copy_tag latest
          copy_tag "$TAG"

          SRC_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${SRC}")
          assert_copied() {
            local dest_tag="$1"
            local raw dest_digest
            raw=$(skopeo inspect --raw --authfile "$AUTH_FILE" "docker://${IMAGE}:${dest_tag}")
            if ! printf '%s' "$raw" | jq -e '
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length > 0)
              and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length > 0)
            ' >/dev/null; then
              echo "::error::${IMAGE}:${dest_tag} 缺少 linux/amd64 或 linux/arm64"
              exit 1
            fi
            dest_digest=$(skopeo inspect --authfile "$AUTH_FILE" --format '{{.Digest}}' "docker://${IMAGE}:${dest_tag}")
            if [ "$dest_digest" != "$SRC_DIGEST" ]; then
              echo "::error::${IMAGE}:${dest_tag} digest ${dest_digest} 与上游 ${SRC_DIGEST} 不一致"
              exit 1
            fi
          }
          assert_copied latest
          assert_copied "$TAG"
          rm -f "$AUTH_FILE"
          echo "已复制多架构镜像 ${IMAGE}:${TAG} 与 ${IMAGE}:latest（${SRC_DIGEST}）"

      - name: 创建 Release (显示更新后的镜像)
        if: steps.compare.outputs.need_copy == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          SOURCE: ${{ steps.copy.outputs.source }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${RELEASE_TOKEN:-${GHCR_TOKEN:-$GITHUB_TOKEN}}"
          UPSTREAM_REPO_URL="https://github.com/${UPSTREAM_REPO}"
          UPSTREAM_RELEASE_URL="${UPSTREAM_REPO_URL}/releases/tag/${TAG}"
          UPSTREAM_NOTES=$(gh release view "$TAG" \
            --repo "$UPSTREAM_REPO" \
            --json body \
            -q .body || true)
          CHANGELOG_URL=""
          # 不再 checkout 上游仓库。根目录 CHANGELOG 用 git tree API 判断。
          ROOT_PATHS=$(gh api "repos/${UPSTREAM_REPO}/git/trees/${TAG}" --jq '.tree[].path' || true)
          for file in \
            CHANGELOG.md Changelog.md changelog.md CHANGELOG CHANGELOG.txt; do
            if printf '%s\n' "$ROOT_PATHS" | grep -qx "$file"; then
              CHANGELOG_URL="${UPSTREAM_REPO_URL}/blob/${TAG}/${file}"
              break
            fi
          done
          if [ -n "$CHANGELOG_URL" ]; then
            CHANGELOG_LINK="- 上游 CHANGELOG: ${CHANGELOG_URL}"
          else
            CHANGELOG_LINK="- 上游 CHANGELOG: 未在仓库根目录找到 CHANGELOG 文件"
          fi

          cat > release-notes.md <<EOF
          已从上游已发布镜像复制并推送（未在 runner 上重新构建）：

          \`\`\`bash
          docker pull ${IMAGE}:${TAG}
          docker pull ${IMAGE}:latest
          \`\`\`

          - 来源镜像: ${SOURCE}
          - 上游 release tag \`${TAG}\` 对应镜像 tag \`${VERSION}\`（去掉前导 v）

          ## 改动摘要 / CHANGELOG

          以下内容来自上游 Release/CHANGELOG：

          ${UPSTREAM_NOTES}

          ## 相关链接

          - 上游仓库: ${UPSTREAM_REPO_URL}
          - 上游 Release: ${UPSTREAM_RELEASE_URL}
          ${CHANGELOG_LINK}
          - 镜像: ${IMAGE}:${TAG}
          - 架构: ${PLATFORMS}
          EOF

          if ! gh release create "omniroute-${TAG}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OmniRoute ${TAG}" \
            --notes-file release-notes.md; then
            echo "::warning::镜像已推送，但创建 GitHub Release 失败。"
            echo "请检查 RELEASE_TOKEN 或仓库 Actions 权限。"
          fi
